<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공부</title>
<meta name="theme-color" content="#FAF4E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="공부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* 흰색 · 노랑 · 베이지 한 벌로 고정한 배색 (기기 테마와 무관하게 동일) */
:root{
  --ground:#FAF4E8;        /* 베이지 바탕 */
  --panel:#FFFFFF;         /* 흰 카드 */
  --panel-2:#F6EEDD;       /* 연한 베이지 */
  --line:#E9DCC0; --line-soft:#F2E8D6;
  --text:#3B3226; --dim:#7E7059; --faint:#AB9E85;
  --amber:#C9950F; --amber-ink:#4A360A; --amber-soft:#FBEFCC; --amber-line:#E8C55E;
  --admin:#5A7F86; --edu:#B4715A;
  --good:#6E8A4E; --good-soft:#EDF1DE;
  --warn:#BC6C2C; --warn-soft:#FAE7D3;
  --shadow:0 1px 2px rgba(90,70,30,.05), 0 8px 22px rgba(120,95,40,.07);
  --r:14px;
  color-scheme: light;
}
*{ box-sizing:border-box; }
body{
  margin:0; color:var(--text);
  background:linear-gradient(180deg,#FFFDF6 0px,var(--ground) 260px) no-repeat, var(--ground);
  font-family:'Noto Sans KR', system-ui, -apple-system, sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:84px;
}
h1,h2,h3,.serif{ font-family:'Gowun Batang','Noto Sans KR',serif; }
button,input,select{ font-family:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; border-radius:8px; }
.tnum{ font-variant-numeric:tabular-nums; }

.wrap{ max-width:560px; margin:0 auto; padding:16px 16px 0; display:flex; flex-direction:column; gap:18px; }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
.pad{ padding:16px; }
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; padding:0 2px; }
.sec-head h2{ font-size:14px; margin:0; font-weight:700; letter-spacing:-.2px; }
.sec-head .sub{ font-size:11px; color:var(--faint); }

/* ── 상단 바 ── */
.bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 2px; }
.barmain{ min-width:0; }
.bar .l{ font-family:'Gowun Batang',serif; font-size:16.5px; font-weight:700; letter-spacing:-.3px; line-height:1.35; }
.bar .dday{ font-size:11.5px; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums; }
.bar .dday em{ font-style:normal; color:var(--amber); font-weight:700; }
.bar .l em{ font-style:normal; color:var(--amber); }
.bar .r{ font-size:11px; color:var(--faint); text-align:right; white-space:nowrap; }
.bar .r b{ color:var(--good); font-weight:500; }
.bar .r b.bad{ color:var(--warn); font-weight:700; }

/* ── 타이머 ── */
.timer{ padding:22px 16px 16px; text-align:center; position:relative; overflow:hidden;
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFBF0 100%); }
.timer.on{ border-color:var(--amber-line); background:linear-gradient(168deg,#FFFDF4 0%,var(--amber-soft) 160%); }
.timer .cap{ font-size:11px; letter-spacing:.08em; color:var(--dim); }
.timer .big{
  font-family:'Gowun Batang',serif; font-size:46px; font-weight:700; line-height:1.1;
  font-variant-numeric:tabular-nums; letter-spacing:.01em; margin:4px 0 2px;
}
.timer.on .big{ color:var(--amber); }
.timer .sub{ font-size:11.5px; color:var(--faint); }
.timer .go{
  margin-top:14px; width:100%; padding:15px; border-radius:12px; border:1px solid var(--amber);
  background:var(--amber); color:var(--amber-ink); font-size:15px; font-weight:700;
}
.timer.on .go{ background:transparent; color:var(--amber); }
.timer .btn2{ display:grid; grid-template-columns:1.4fr 1fr; gap:8px; }
.timer .go.end{ background:var(--panel-2); color:var(--dim); border-color:var(--line); font-size:13.5px; }
.timer .crossed{ margin-top:10px; background:var(--amber-soft); color:var(--amber-ink); border-radius:9px; padding:8px 10px; font-size:11.5px; line-height:1.5; }
.timer .fixlink{ margin-top:10px; background:none; border:none; color:var(--faint); font-size:11.5px; text-decoration:underline; text-underline-offset:3px; }
.undo{ margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--panel-2); border-radius:9px; padding:7px 8px 7px 11px; font-size:11.5px; color:var(--dim); }
.undo button{ background:none; border:none; color:var(--amber); font-weight:700; font-size:11.5px; padding:2px 6px; }
.undo button+button{ color:var(--faint); font-weight:400; font-size:13px; }
.editrow{ margin-top:11px; display:flex; align-items:center; justify-content:center; gap:5px; font-size:11.5px; color:var(--dim); }
.editrow input{ width:52px; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:8px; font-size:14px; text-align:center; font-variant-numeric:tabular-nums; }
.editrow button{ border:1px solid var(--line); background:var(--panel-2); border-radius:9px; padding:8px 11px; font-size:12px; margin-left:3px; }
.editrow button.ok{ border-color:var(--amber-line); background:var(--amber-soft); color:var(--amber); font-weight:700; }
.pulse{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--amber); margin-right:6px; vertical-align:1px; animation:bp 1.6s ease-in-out infinite; }
@keyframes bp{ 0%,100%{opacity:1} 50%{opacity:.25} }

/* ── 과목 기록 ── */
.subj{ padding:14px 16px; border-top:1px solid var(--line-soft); }
.subj:first-child{ border-top:none; }
.subj-hd{ display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700; margin-bottom:8px; }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.subj-hd .rest{ margin-left:auto; font-weight:400; font-size:11px; color:var(--faint); }
.track{ height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
.fill{ height:100%; border-radius:4px; transition:width .25s ease; }
.subj-meta{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--dim); margin-top:7px; font-variant-numeric:tabular-nums; }
.counter{ display:flex; align-items:center; gap:8px; margin-top:10px; }
.counter button{
  width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel-2); font-size:20px; line-height:1; font-weight:700;
}
.counter button.plus{ border-color:var(--amber-line); background:var(--amber-soft); color:var(--amber); }
.counter .val{ flex:1; text-align:center; }
.counter .val input{
  width:100%; background:transparent; border:none; text-align:center;
  font-family:'Gowun Batang',serif; font-size:24px; font-weight:700; font-variant-numeric:tabular-nums;
  padding:0;
}
.counter .val span{ display:block; font-size:10.5px; color:var(--faint); margin-top:-2px; }

/* ── 오늘 상태 줄 ── */
.state-row{ display:flex; gap:6px; padding:12px 16px 0; }
.state-row button{
  flex:1; padding:9px 4px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel-2); color:var(--dim); font-size:11.5px; line-height:1.35;
}
.state-row button[aria-pressed="true"]{ border-color:var(--amber-line); background:var(--amber-soft); color:var(--amber); font-weight:700; }
.state-row button.rest[aria-pressed="true"]{ border-color:var(--dim); background:var(--panel-2); color:var(--text); }

.attend{ display:flex; gap:6px; padding:8px 16px 0; }
.attend button{ flex:1; padding:10px 4px; border-radius:10px; border:1px dashed var(--line);
  background:transparent; color:var(--dim); font-size:11.5px; }
.attend button[aria-pressed="true"]{ border-style:solid; border-color:var(--good); background:var(--good-soft); color:var(--good); font-weight:700; }
.msgblock{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); font-size:12px; line-height:1.7; }
.condline{ padding:9px 16px 0; font-size:11.5px; line-height:1.6; color:var(--dim); }
.msg{ margin:12px 16px 0; border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.5; }
.msg.warn{ background:var(--warn-soft); color:var(--warn); }
.msg.good{ background:var(--good-soft); color:var(--good); }
.msg.amber{ background:var(--amber-soft); color:var(--amber); }

.totalline{ margin:12px 16px 0; background:var(--amber-soft); border-radius:10px; padding:9px 12px;
  display:flex; flex-direction:column; gap:2px; font-size:12.5px; color:var(--amber-ink); }
.totalline b{ font-family:'Gowun Batang',serif; font-size:15px; }
.totalline .sub{ font-size:11px; opacity:.75; }
.rt{ padding:14px 16px 4px; border-top:1px solid var(--line-soft); }
.rt-hd{ display:flex; align-items:baseline; justify-content:space-between; font-size:13px; font-weight:700; }
.rt-n{ font-size:11.5px; font-weight:400; color:var(--faint); font-variant-numeric:tabular-nums; }
.rt-n.full{ color:var(--good); font-weight:700; }
.rt-g{ font-size:10.5px; color:var(--faint); letter-spacing:.08em; margin:11px 0 3px; }
.rt-i{ display:flex; align-items:center; gap:10px; width:100%; padding:7px 0; background:none; border:none; text-align:left; }
.rt-i .box{ width:21px; height:21px; border-radius:6px; border:1.5px solid var(--line); background:var(--panel-2);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent; transition:.12s; }
.rt-i .lb{ font-size:12.5px; line-height:1.4; }
.rt-i[aria-pressed="true"] .box{ background:var(--amber); border-color:var(--amber); color:var(--amber-ink); }
.rt-i[aria-pressed="true"] .lb{ color:var(--faint); text-decoration:line-through; text-decoration-thickness:1px; }
.memo{ padding:14px 16px 4px; border-top:1px solid var(--line-soft); }
.memo-hd{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:700; margin-bottom:7px; }
.memo-st{ font-size:11px; font-weight:400; color:var(--good); }
.memo textarea{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
  padding:10px; font-size:12.5px; line-height:1.6; resize:vertical; font-family:inherit; color:var(--text); }
.memo textarea::placeholder{ color:var(--faint); }
.quote{ padding:14px 16px; border-top:1px solid var(--line-soft); display:flex; gap:10px; align-items:flex-start; }
.quote .txt{ font-family:'Gowun Batang',serif; font-size:13.5px; line-height:1.65; flex:1; }
.quote .who{ font-size:10.5px; color:var(--amber); font-weight:700; margin-bottom:3px; letter-spacing:.04em; }
.quote button{ background:none; border:none; color:var(--faint); font-size:14px; padding:2px; }

/* ── 캘린더 ── */
.cal-hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-hd .t{ font-family:'Gowun Batang',serif; font-weight:700; font-size:14px; }
.cal-hd .nav{ display:flex; gap:5px; }
.cal-hd .nav button{ width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); }
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.dow{ text-align:center; font-size:10.5px; color:var(--faint); padding-bottom:2px; }
.cell{
  aspect-ratio:1; border-radius:10px; background:var(--panel-2); border:1px solid transparent; padding:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums;
}
.cell.void{ background:transparent; }
.cell.today{ border-color:var(--amber-line); color:var(--amber); font-weight:700; }
.cell.sel{ background:var(--panel); border-color:var(--text); }
.cell.rest{ opacity:.45; }
.cell.full{ background:var(--good-soft); }
.cell .dots{ display:flex; gap:2px; height:5px; }
.cell .dots i{ width:5px; height:5px; border-radius:50%; display:block; }

/* ── 기록 통계 ── */
.wk{ display:flex; align-items:flex-end; gap:8px; height:104px; }
.wk-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end; height:100%; }
.wk-bar{ width:100%; max-width:36px; border-radius:6px 6px 0 0; background:#EBDFC5; min-height:2px; }
.wk-bar.cur{ background:linear-gradient(180deg,#E7B833,var(--amber)); }
.wk-v{ font-size:10.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
.wk-l{ font-size:10px; color:var(--faint); }
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.tile{ background:var(--panel-2); border-radius:11px; padding:11px 12px; }
.tile .k{ font-size:11px; color:var(--dim); }
.tile .v{ font-family:'Gowun Batang',serif; font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
.tile .v small{ font-family:'Noto Sans KR',sans-serif; font-size:12px; font-weight:400; color:var(--dim); }
.daylog{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line-soft); font-size:12.5px; }
.daymemo{ font-size:11.5px; color:var(--dim); background:var(--panel-2); border-radius:8px;
  padding:7px 10px; margin:0 0 8px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
.daylog .att b{ font-weight:400; margin-left:2px; }
.daylog .r{ color:var(--dim); font-variant-numeric:tabular-nums; }

/* ── 노트 ── */
.note-form{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.note-form select{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px; font-size:12px; }
.note-form input{ flex:1; min-width:140px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:12.5px; }
.note-form button{ background:var(--amber); color:var(--amber-ink); border:1px solid var(--amber); border-radius:10px; padding:9px 15px; font-size:12.5px; font-weight:700; }
.chips{ display:flex; gap:6px; margin-bottom:10px; }
.chips button{ border:1px solid var(--line); background:var(--panel-2); color:var(--dim); border-radius:999px; padding:5px 12px; font-size:11.5px; }
.chips button[aria-pressed="true"]{ border-color:var(--text); background:var(--panel); color:var(--text); font-weight:700; }
.note{ display:flex; gap:9px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line-soft); }
.note .b{ flex:1; min-width:0; }
.note .t{ font-size:12.5px; word-break:break-word; }
.note .m{ font-size:10.5px; color:var(--faint); margin-top:2px; }
.note .a{ display:flex; gap:5px; flex-shrink:0; }
.note .a button{ border:1px solid var(--line); background:var(--panel-2); color:var(--dim); border-radius:8px; padding:5px 9px; font-size:11px; }
.note .a button.ok{ border-color:var(--good); color:var(--good); }
.empty{ text-align:center; color:var(--faint); font-size:12px; padding:18px 0; }

/* ── 설정 ── */
.f{ display:flex; flex-direction:column; gap:4px; }
.f label{ font-size:11px; color:var(--dim); }
.f input,.f select{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px; font-size:12.5px; width:100%; }
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.seg2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.seg2 button{ padding:10px 6px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--dim); font-size:11.5px; line-height:1.35; }
.seg2 button b{ display:block; font-family:'Gowun Batang',serif; font-size:13.5px; color:var(--text); }
.seg2 button[aria-pressed="true"]{ border-color:var(--amber-line); background:var(--amber-soft); color:var(--amber); }
.seg2 button[aria-pressed="true"] b{ color:var(--amber); }
.sedit{ border:1px solid var(--line); border-radius:11px; padding:12px; display:flex; flex-direction:column; gap:9px; }
.sedit .hd{ display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; }
.sedit .hd button{ border:1px solid var(--line); background:transparent; color:var(--faint); border-radius:8px; padding:4px 9px; font-size:11px; font-weight:400; }
.calc{ background:var(--panel-2); border-radius:10px; padding:10px 11px; display:flex; flex-direction:column; gap:7px; }
.calc-now{ font-size:11px; color:var(--dim); line-height:1.6; }
.calc-now b{ color:var(--text); }
.calc-in{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); }
.calc-in input{ width:64px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px; font-size:13px; text-align:center; }
.calc-out{ font-size:11.5px; color:var(--amber-ink); background:var(--amber-soft); border-radius:8px; padding:8px 10px; line-height:1.6; }
.calc-out button{ display:block; margin-top:6px; border:1px solid var(--amber-line); background:var(--panel); color:var(--amber);
  border-radius:8px; padding:6px 10px; font-size:11.5px; font-weight:700; }
.rt-edit{ display:flex; gap:6px; align-items:center; }
.rt-edit input{ flex:1; min-width:0; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:8px; font-size:12.5px; }
.rt-edit input.g{ flex:0 0 66px; text-align:center; color:var(--dim); }
.rt-edit button{ flex-shrink:0; width:32px; height:32px; border:1px solid var(--line); background:transparent; color:var(--faint); border-radius:9px; font-size:15px; }
.iconrow{ display:flex; align-items:center; gap:14px; }
.iconprev{ width:64px; height:64px; border-radius:15px; flex-shrink:0; box-shadow:var(--shadow); background:var(--panel-2); }
.ghost{ border:1px dashed var(--line); background:transparent; color:var(--dim); border-radius:10px; padding:10px; font-size:12px; width:100%; }
.hint{ font-size:10.5px; color:var(--faint); }
.foot{ text-align:center; color:var(--faint); font-size:11px; line-height:1.6; padding:4px 10px 0; }

/* ── 하단 탭 ── */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--panel); border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  display:flex; justify-content:center; gap:2px;
}
.tabbar .in{ display:flex; width:100%; max-width:560px; }
.tabbar button{
  flex:1; background:none; border:none; padding:7px 2px 5px; color:var(--faint);
  font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px;
}
.tabbar button b{ font-size:16px; line-height:1; font-weight:400; }
.tabbar button[aria-pressed="true"]{ color:var(--amber); font-weight:700; }
.badge{ position:absolute; transform:translate(14px,-4px); background:var(--warn); color:#fff; border-radius:999px; font-size:9px; padding:0 5px; line-height:14px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<div class="wrap" id="app"></div>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>

<script>
/* ===================== 상수 ===================== */
const DOW = ['일','월','화','수','목','금','토'];
const LOCAL_KEY = 'seoli-planner-v3';
const REVIEW_STEPS = [1,3,7,14,30];
const PALETTE = ['--amber','--edu','--admin','--good','--warn'];
const COLOR_NAME = {'--amber':'노랑','--edu':'베이지브라운','--admin':'청록','--good':'올리브','--warn':'주황'};
const MAX_SESSION = 6*3600; // 끄는 걸 잊었을 때 상한

const QUOTES = [
  {c:'praise', t:'오늘 목표 다 채웠어! 이런 날이 쌓여서 합격이 되는 거야. 이제 좀 쉬어.'},
  {c:'praise', t:'계획대로 끝낸 날. 이게 제일 어려운 건데 해냈네.'},

  {c:'push',  t:'인스타 5분이면 단어 열 개는 외운다? 나 대신 이거라도 응원할게.'},

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function pd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isWknd(d){ const w=d.getDay(); return w===0||w===6; }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sel(){ return ui.sel || activeDs(); }
function isSelToday(){ return sel()===activeDs(); }

function fmtClock(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=Math.floor(sec%60);
  return (h>0? h+':':'') + String(m).padStart(h>0?2:1,'0') + ':' + String(s).padStart(2,'0');
}
function fmtDur(sec){
  const h=Math.floor(sec/3600), m=Math.round(sec%3600/60);
  if(sec<60) return '0분';
  return (h?h+'시간 ':'') + (m?m+'분':(h?'':'0분'));
}
function day(ds){
  if(!S.days[ds]) S.days[ds] = { rest:false, cond:100, sec:0, sess:0, am:null, pm:null, done:{}, chk:{}, memo:'' };
  const d = S.days[ds];
  if(!d.done) d.done={};
  if(!d.chk) d.chk={};
  if(typeof d.memo!=='string') d.memo='';
  if(typeof d.sec!=='number') d.sec=0;
  if(typeof d.sess!=='number') d.sess=0;
  if(d.cond!==100 && d.cond!==30) d.cond=100;   // 100 / 30 두 단계만 사용
  S.subjects.forEach(s=>{ if(!(s.id in d.done)) d.done[s.id]=0; });
  return d;
}
function totalDone(sid){                     // 앱에서 기록한 분량
  let n=0; for(const k in S.days){ const d=S.days[k]; n += (d.done&&d.done[sid])||0; } return n;
}
function preOf(sid){                          // 앱 쓰기 전에 이미 들은 분량
  const s = S.subjects.find(x=>x.id===sid); return (s && +s.pre) || 0;
}
function totalAll(sid){ return preOf(sid) + totalDone(sid); }

/* 불러오기: 세 군데를 모두 읽고 가장 최근 것을 쓴다 */
function loadBest(){
  const cands = [];
  try{ const r = localStorage.getItem(LOCAL_KEY); if(r) cands.push(JSON.parse(r)); }catch(e){}
  try{ const r = sessionStorage.getItem(LOCAL_KEY); if(r) cands.push(JSON.parse(r)); }catch(e){}
  try{ const r = localStorage.getItem('seoli-planner-v2'); if(r) cands.push(JSON.parse(r)); }catch(e){}
  if(!cands.length) return null;
  cands.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  return cands[0];
}

function save(){
  S.updatedAt = Date.now();
  saveLocal();
}


function migrate(o){
  const s = Object.assign(clone(DEFAULT_STATE), o||{});
  for(const k in DEFAULT_STATE){ if(s[k]==null && k!=='session') s[k]=clone(DEFAULT_STATE[k]); }
  if(!s.session && o && o.run && o.run.at) s.session = { ds:o.run.ds, startedAt:o.run.at };  // 이전 버전 이어받기
  delete s.run;
  s.subjects = (s.subjects||[]).map((x,i)=>Object.assign({ id:'s'+i, name:'과목', unit:'강', total:0, deadline:'', color:PALETTE[i%PALETTE.length] }, x));
  s.notes = s.notes||[]; s.days = s.days||{};
  if(!s.meta.title) s.meta.title = DEFAULT_STATE.meta.title;
  if(!(o && o.preSeeded)){                       // 이미 들은 강의 수 1회 반영
    s.subjects.forEach(x=>{ if(x.pre==null) x.pre = x.id==='admin'?21 : (x.id==='edu'?17:0); });
    s.preSeeded = true;
  }
  s.subjects.forEach(x=>{ if(x.pre==null) x.pre=0; });
  if(!(o && o.routineSeeded)){ s.routines = clone(DEFAULT_STATE.routines); s.routineSeeded = true; }
  s.routines = s.routines || [];
  return s;
}
async function boot(){
  probeStorage();

  if(best) S = migrate(best);
  if(running() && liveSec() >= MAX_SESSION) pauseStudy();

}

/* ===================== 학습일 스톱워치 =====================
   개념: '오늘 공부 시작'을 누르면 그 날짜로 학습일이 열린다.
   '오늘 공부 종료'를 누르기 전까지는 자정을 넘겨도 계속 그 날짜에 기록된다.
   '쉬러 가기'는 그 순간까지의 시간을 즉시 기록에 확정하므로,
   몇 시간을 자리 비워도 이미 기록된 시간은 사라지지 않는다.
   S.session = { ds:'2026-09-02', startedAt: <시각 ms | null> }
     · session 없음      → 학습일 닫힘
     · startedAt 있음    → 공부하는 중
     · startedAt null    → 쉬는 중 (학습일은 열려 있음)          */

function hasSession(){ return !!(S.session && S.session.ds); }
function running(){ return hasSession() && !!S.session.startedAt; }
function activeDs(){ return hasSession() ? S.session.ds : today(); }

function liveSec(){
  if(!running()) return 0;
  return Math.min(MAX_SESSION, Math.max(0, Math.floor((Date.now()-S.session.startedAt)/1000)));
}
function secOf(ds){
  return ((S.days[ds] && S.days[ds].sec)||0) + (hasSession() && S.session.ds===ds ? liveSec() : 0);
}

/* 되돌리기: 버튼을 잘못 눌렀을 때 직전 상태로 복구 */
function snapshot(label){
  const ds = activeDs(), d = S.days[ds];
  ui.undo = { label, ds, sec:(d&&d.sec)||0, sess:(d&&d.sess)||0, session: S.session?clone(S.session):null };
}
function undoLast(){
  if(!ui.undo) return;
  const u = ui.undo, d = day(u.ds);
  d.sec = u.sec; d.sess = u.sess;
  S.session = u.session ? clone(u.session) : null;
  ui.undo = null; ui.sel = null; ui.quote = null;
  save(); render();
}

function commitSegment(){          // 진행 중인 구간을 기록에 확정
  if(!running()) return 0;
  const add = liveSec(), d = day(S.session.ds);
  if(add > 0){ d.sec += add; d.sess += 1; }
  S.session.startedAt = null;
  return add;
}
function startDay(){               // 오늘 공부 시작
  if(hasSession()) return;
  snapshot('공부 시작');
  S.session = { ds: today(), startedAt: Date.now() };
  ui.sel = null; ui.quote = pickQuote();
  save(); render();
}
function resumeStudy(){            // 쉬었다가 다시 시작
  if(!hasSession() || running()) return;
  snapshot('다시 시작');
  S.session.startedAt = Date.now();
  ui.quote = pickQuote();
  save(); render();
}
function pauseStudy(){             // 쉬러 가기 (시간은 여기서 확정 저장)
  if(!running()) return;
  snapshot('쉬러 가기');
  commitSegment();
  ui.quote = null; save(); render();
}
function endDay(){                 // 오늘 공부 종료 → 학습일 닫기
  if(!hasSession()) return;
  snapshot('오늘 공부 종료');
  commitSegment();
  S.session = null;
  ui.quote = null; save(); render();
}
function toggleChk(ds, id){
  const d = day(ds);
  if(d.chk[id]) delete d.chk[id]; else d.chk[id] = true;
  ui.quote = null; save(); render();

function chkCount(ds){

  const total = (S.routines||[]).length;
  if(!d || !d.chk) return { done:0, total };

function toggleAtt(ds, k){        // 오전 / 육퇴 후 출석 체크 (누른 시각까지 기록)

function startSecTick(){

/* ===================== 계획 ===================== */
function planFor(sub){
  const plan={};
  if(!sub.deadline) return plan;
  const t0=today();
  if(diffDays(t0, sub.deadline)<0) return plan;
  const remain = Math.max(sub.total-totalAll(sub.id),0);
  const days=[];
  for(let d=pd(t0); d<=pd(sub.deadline); d=addD(d,1)){
    const ds=ymd(d), info=S.days[ds];
    if(info && info.rest) continue;
    const base = isWknd(d)? (S.weekendWeight||1) : (S.weekdayWeight||1);
    const cond = info ? (info.cond||100)/100 : 1;
    days.push({ds, w: base*cond});
  }
  const sum = days.reduce((a,b)=>a+b.w,0);
  if(sum<=0) return plan;
  days.forEach(x=> plan[x.ds] = remain*(x.w/sum));
  return plan;
}
function planRotate(){
  const out={}, t0=today();
  const dls = S.subjects.map(s=>s.deadline).filter(Boolean).sort();
  if(!dls.length) return out;
  const last = dls[dls.length-1];
  if(diffDays(t0,last)<0) return out;
  const all=[];
  for(let d=pd(t0); d<=pd(last); d=addD(d,1)){
    const ds=ymd(d);
    if(S.days[ds] && S.days[ds].rest) continue;
    all.push(ds);
  }
  const assign={}; S.subjects.forEach(s=>assign[s.id]=[]);
  for(let i=0,k=0;i<all.length;i+=2,k++){
    const s = S.subjects[k%S.subjects.length];
    all.slice(i,i+2).forEach(ds=>{ if(!s.deadline || diffDays(ds,s.deadline)>=0) assign[s.id].push(ds); });
  }
  S.subjects.forEach(s=>{
    const list=assign[s.id]; if(!list||!list.length) return;
    const remain=Math.max(s.total-totalAll(s.id),0);
    const ws=list.map(ds=>{ const i=S.days[ds]; return i?(i.cond||100)/100:1; });
    const sum=ws.reduce((a,b)=>a+b,0)||1;
    list.forEach((ds,i)=>{ if(!out[ds]) out[ds]={}; out[ds][s.id]=remain*(ws[i]/sum); });
  });
  return out;
}
function plans(){
  if(planCache) return planCache;
  const p={};
  if(S.phase==='pastexam'){ const r=planRotate(); for(const ds in r) p[ds]=r[ds]; }
  else S.subjects.forEach(s=>{ const sp=planFor(s); for(const ds in sp){ if(!p[ds]) p[ds]={}; p[ds][s.id]=sp[ds]; } });
  planCache=p; return p;
}
function target(ds,sid){ const p=plans()[ds]; return p?(p[sid]||0):0; }

function pace(sub){
  const remain = Math.max(sub.total-totalAll(sub.id),0);
  if(remain<=0) return {state:'done'};
  let sum=0,n=0;
  for(let i=1;i<=7;i++){
    const ds=ymd(addD(new Date(),-i)), info=S.days[ds];
    if(info && info.rest) continue;
    sum += info ? (info.done[sub.id]||0) : 0; n++;
  }
  if(!n || sum<=0) return {state:'unknown', remain};
  const per=sum/n, need=Math.ceil(remain/per), eta=ymd(addD(new Date(),need));
  if(!sub.deadline) return {state:'nodeadline', eta, remain};
  const over = diffDays(sub.deadline, eta);
  return { state: over<=0?'ok':'late', eta, over, remain };
}
function streak(){
  let n=0;
  for(let i=0;i<400;i++){
    const ds=ymd(addD(new Date(),-i)), info=S.days[ds];
    if(!info){ if(i===0) continue; break; }
    if(info.rest) continue;
    const any = S.subjects.some(s=>(info.done[s.id]||0)>0) || (info.sec||0)>=300;
    if(any) n++; else { if(i===0) continue; break; }
  }
  return n;
}

/* ===================== 노트 ===================== */
function dueNotes(){ const t=today(); return S.notes.filter(n=>!n.done && (!n.due || diffDays(n.due,t)>=0)); }
function addNote(sid,text){
  if(!text || !text.trim()) return;
  S.notes.unshift({ id:'n'+Date.now(), sid, text:text.trim(), created:today(), stage:0, due:ymd(addD(new Date(),REVIEW_STEPS[0])), done:false, seen:0 });
  if(S.notes.length>400) S.notes.length=400;
  save(); render();
}
function reviewNote(id){
  const n=S.notes.find(x=>x.id===id); if(!n) return;
  n.seen=(n.seen||0)+1;
  n.stage=Math.min(n.stage+1, REVIEW_STEPS.length-1);
  n.due=ymd(addD(new Date(), REVIEW_STEPS[n.stage]));
  save(); render();
}
function closeNote(id){ const n=S.notes.find(x=>x.id===id); if(n){ n.done=true; save(); render(); } }
function delNote(id){ S.notes=S.notes.filter(x=>x.id!==id); save(); render(); }

/* ===================== 응원 ===================== */
function sonCall(){                       // '율이' → '율이가', '민준' → '민준이가'
  const n = (S.meta.son||'').trim();
  if(!n) return '아이';
  return /이$/.test(n) ? n+'가' : n+'이가';
}
function pickQuote(){
  const ds=sel(), d=day(ds);
  const anyDone = S.subjects.some(s=>(d.done[s.id]||0)>0);
  let ctx;
  if(running()) ctx='run';
  else if(d.rest) ctx='holiday';
  else if(anyDone && S.subjects.every(s=>{ const t=target(ds,s.id); return t<=0 || (d.done[s.id]||0)>=t-0.01; })) ctx='praise';
  else if(d.cond<=30) ctx='comfort';
  else if(new Date().getHours()>=22 && isSelToday()) ctx='night';
  else if(S.subjects.some(s=>pace(s).state==='late')) ctx='push';
  else ctx='any';
  const pool = QUOTES.filter(q=>q.c===ctx);
  const list = pool.length?pool:QUOTES;
  return list[Math.floor(Math.random()*list.length)];
}

/* ===================== 렌더 ===================== */
function render(){
  planCache = null;
  ui.renderedDay = today();
  if(!ui.quote) ui.quote = pickQuote();
  const body = ui.tab==='today' ? viewToday()
             : ui.tab==='record' ? viewRecord()
             : ui.tab==='note' ? viewNote()
             : viewSettings();
  document.getElementById('app').innerHTML = topBar() + body;
  document.getElementById('tabs').innerHTML = tabBar();
  bind();
  startSecTick();
}

function topBar(){
  const parts = [];
  ['national','local'].forEach(k=>{
    const d = S.exams[k];
    if(!d) return;
    const n = diffDays(today(), d);
    parts.push(`${k==='national'?'국가직':'지방직'} <em>${n===0?'D-DAY':(n>0?'D-'+n:'D+'+Math.abs(n))}</em>`);
  });
  const title = (S.meta.title||'').trim() || `${esc(S.meta.wife)}의 플래너`;
  return `<div class="bar">
    <div class="barmain">
      <div class="l">${esc(title)}</div>
      ${parts.length?`<div class="dday">${parts.join(' &nbsp;·&nbsp; ')}</div>`:''}

}

  return t('today','📖','오늘') + t('record','📅','기록') + t('note','✏️','오답', due) + t('settings','⚙️','설정');

/* 오늘 상태가 목표량을 어떻게 바꿨는지 한 줄로 설명 */
function condHint(ds, d){
  if(d.rest) return '오늘은 쉬는 날 — 목표를 0으로 두고, 이 분량은 남은 날에 나눠 붙였어요. 연속 일수도 안 끊겨요.';
  const cur = S.subjects.map(s=>({ s, t: target(ds, s.id) })).filter(x=>x.t>0);
  if(!cur.length) return '설정에서 과목의 총 분량과 마감일을 정하면 오늘 할 양이 자동으로 계산돼요.';
  if(d.cond===100) return '평소대로 하는 날 — 마감일까지 남은 분량을 고르게 나눈 양이에요.';
  // 100%였다면 얼마였을지 비교
  const keep = d.cond; d.cond = 100; planCache = null;
  const full = {}; S.subjects.forEach(s=> full[s.id] = target(ds, s.id));
  d.cond = keep; planCache = null;
  const parts = cur.map(x=>`${esc(x.s.name)} ${full[x.s.id].toFixed(1)}→${x.t.toFixed(1)}${esc(x.s.unit)}`);
  const word = '많이 힘든 날';
  return `${word} — 오늘 목표를 ${parts.join(', ')}으로 줄였어요. 뺀 만큼은 남은 날에 자동으로 나눠 붙습니다.`;
}

  // 되돌리기 줄
  const undoRow = (active && ui.undo) ? `<div class="undo">
      <span>방금 ‘${esc(ui.undo.label)}’ 눌렀어요</span>

    </div>` : '';

  // 시간 직접 고치기

      <input type="number" min="0" max="23" value="${h}" data-eh aria-label="시간"><span>시간</span>

              : open ? '잠깐 쉬는 중'
              : '오늘 공부 시간';
    const crossed = open && S.session.ds !== today();
    const btns = !open
      ? `<button class="go" data-act="start">▶  오늘 공부 시작</button>`

      ${crossed?`<div class="crossed">자정이 지났지만 ‘오늘 공부 종료’를 누르기 전까지 ${dayLabel} 공부로 쌓여요.</div>`:''}
      ${btns}
      ${undoRow}
      ${editRow}

  } else {
    timer = `<div class="panel timer">
      <div class="cap">${dayLabel}에 공부한 시간</div>
      <div class="big tnum">${fmtClock(sec)}</div>
      <div class="sub">${d.sess||0}번 앉았어요</div>
      ${editRow}

    </div>`;
  }

  const subs = S.subjects.map(s=>{
    const t = target(ds,s.id), done = d.done[s.id]||0;
    const tot = totalAll(s.id), totPct = s.total>0?Math.min(100,Math.round(tot/s.total*100)):0;
    const dayPct = t>0 ? Math.min(100, Math.round(done/t*100)) : (done>0?100:0);
    return `<div class="subj">
      <div class="subj-hd"><span class="dot" style="background:var(${s.color})"></span>${esc(s.name)}
        <span class="rest">${S.phase==='pastexam' && t<=0.001 ? '오늘은 안 하는 과목' : '오늘 목표 '+t.toFixed(1)+esc(s.unit)}</span></div>
      <div class="track"><div class="fill" style="width:${dayPct}%;background:var(${s.color})"></div></div>
      <div class="counter">

    msg = `<div class="msg good">쉬는 날인데도 채웠네요. 남은 분량은 자동으로 다시 나눠뒀어요.</div>`;
  else if(late.length)
    msg = `<div class="msg warn">${late.map(s=>esc(s.name)+' '+pace(s).over+'일 초과').join(' · ')} — 지금 페이스 기준이에요. 오늘 목표만 지키면 다시 따라잡혀요.</div>`;

  const q = ui.quote || pickQuote();
  return `${warn}${timer}
  <div class="panel">
    <div class="state-row">
      <button class="rest" data-rest aria-pressed="${d.rest}">${d.rest?'쉬는 날 ✓':'쉬는 날'}</button>
      <button data-cond="100" aria-pressed="${d.cond===100}">보통</button>
      <button data-cond="30" aria-pressed="${d.cond===30}">많이 힘듦</button>
    </div>
    <div class="attend">
      <button data-att="am" aria-pressed="${!!d.am}">☀️ 오전 출석${d.am?' · '+esc(d.am):''}</button>
      <button data-att="pm" aria-pressed="${!!d.pm}">🌙 육퇴 후 출석${d.pm?' · '+esc(d.pm):''}</button>
    </div>
    <div class="condline">${condHint(ds, d)}</div>
    ${msg}
    <div style="height:12px"></div>
    ${totalLine(ds)}
    ${subs}
    ${routineBlock(ds, d)}
    <div class="memo">
      <div class="memo-hd"><span>오늘 한 줄</span><span class="memo-st" id="memostate">${d.memo?'저장됨':''}</span></div>
      <textarea id="memo" rows="2" maxlength="300" placeholder="오늘 어땠는지 짧게 남겨두면 나중에 큰 힘이 돼요.">${esc(d.memo)}</textarea>
    </div>
    <div class="quote">
      <div class="txt"><div class="who">${esc(sonCall())} 보내는 한마디</div>${esc(q.t)}</div>
      <button data-newquote aria-label="다른 문구 보기">↻</button>
    </div>
  </div>
  <div class="foot">${hasSession()?'‘오늘 공부 종료’를 누르면 이 날의 기록이 마무리돼요.':'‘오늘 공부 시작’을 누르면 오늘 날짜로 기록이 열려요.'}<br>연속 ${streak()}일째 — 쉬는 날은 끊기지 않아요.</div>`;
}

function totalLine(ds){
  const rows = S.subjects.map(s=>({ s, t: target(ds, s.id) })).filter(x=>x.t>0.001);
  if(!rows.length) return '';
  const sum = rows.reduce((a,b)=>a+b.t,0);
  const unit = rows[0].s.unit;
  const parts = rows.map(x=>`${esc(x.s.name)} ${x.t.toFixed(1)}`).join(' + ');
  const mode = S.phase==='pastexam' ? '한 과목씩 몰아서' : '매일 두 과목씩';
  return `<div class="totalline">
    <span>오늘 총 목표 <b>${sum.toFixed(1)}${esc(unit)}</b></span>
    <span class="sub">${parts} · ${mode}</span>
  </div>`;
}

function routineBlock(ds, d){
  const list = S.routines||[];
  if(!list.length) return '';
  const c = chkCount(ds);
  const groups = [];
  list.forEach(r=>{
    const g = (r.g||'').trim();
    let bucket = groups.find(x=>x.g===g);
    if(!bucket){ bucket={g, items:[]}; groups.push(bucket); }
    bucket.items.push(r);
  });
  const body = groups.map(gr=>`
    ${gr.g?`<div class="rt-g">${esc(gr.g)}</div>`:''}
    ${gr.items.map(r=>`<button class="rt-i" data-chk="${r.id}" aria-pressed="${!!d.chk[r.id]}">
        <span class="box">✓</span><span class="lb">${esc(r.t)}</span>
      </button>`).join('')}`).join('');
  return `<div class="rt">
    <div class="rt-hd"><span>매일 할 것</span><span class="rt-n ${c.done===c.total?'full':''}">${c.done} / ${c.total}</span></div>
    ${body}
  </div>`;
}

/* ---------- 기록 ---------- */
function viewRecord(){
  const y=ui.calY, m=ui.calM;
  const start=new Date(y,m,1).getDay(), len=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<start;i++) cells+=`<div class="cell void"></div>`;
  for(let n=1;n<=len;n++){
    const ds=ymd(new Date(y,m,n)), info=S.days[ds];
    const cls=['cell'];
    if(ds===today()) cls.push('today');
    if(ds===sel()) cls.push('sel');
    if(info&&info.rest) cls.push('rest');
    let dots='', full=true, has=false;
    S.subjects.forEach(s=>{
      const t=target(ds,s.id), done=info?(info.done[s.id]||0):0;
      if(t>0){ has=true; if(done<t-0.01) full=false; }
      if(t>0||done>0) dots+=`<i style="background:${done>0&&(t<=0||done>=t-0.01)?'var('+s.color+')':'var(--line)'}"></i>`;
    });
    if(has&&full) cls.push('full');
    cells+=`<button class="${cls.join(' ')}" data-pick="${ds}"><span>${n}</span><div class="dots">${dots}</div></button>`;
  }

  const t0=pd(today()), thisSun=addD(t0,-t0.getDay());
  const weeks=[];
  for(let w=3;w>=0;w--){
    const st=addD(thisSun,-7*w), en=addD(st,6);
    let planned=0, done=0, secs=0;
    for(let d=new Date(st); d<=en; d=addD(d,1)){
      if(d>t0) continue;
      const ds=ymd(d), info=S.days[ds];
      secs += info?(info.sec||0):0;
      S.subjects.forEach(s=>{ planned+=target(ds,s.id); done += info?(info.done[s.id]||0):0; });
    }
    const pct = planned>0?Math.round(done/planned*100):(done>0?100:0);
    weeks.push({ lab:`${st.getMonth()+1}/${st.getDate()}`, pct:Math.min(pct,150), secs, cur:w===0 });
  }
  const maxSec = Math.max(3600, ...weeks.map(w=>w.secs));
  const bars = weeks.map(w=>`<div class="wk-col">
    <div class="wk-v">${w.secs>0?fmtDur(w.secs):'—'}</div>
    <div class="wk-bar ${w.cur?'cur':''}" style="height:${Math.max(2, w.secs/maxSec*72)}px"></div>
    <div class="wk-l">${w.lab}${w.cur?' 이번주':''}</div>
  </div>`).join('');

  let allDone=0, allTotal=0, allSec=0, studyDays=0, restDays=0;
  S.subjects.forEach(s=>{ allDone+=totalAll(s.id); allTotal+=s.total; });
  let attDays=0;
  for(const k in S.days){
    const i=S.days[k]; allSec += i.sec||0;
    if(i.am || i.pm) attDays++;
    if(i.rest) restDays++;
    else if(S.subjects.some(s=>(i.done[s.id]||0)>0) || (i.sec||0)>=300) studyDays++;
  }
  const overall = allTotal>0?Math.round(allDone/allTotal*100):0;

  // 최근 7일 로그
  const logs=[];
  for(let i=0;i<7;i++){
    const ds=ymd(addD(new Date(),-i)), info=S.days[ds];
    const dt=pd(ds);
    const done = info ? S.subjects.reduce((a,s)=>a+(info.done[s.id]||0),0) : 0;
    const att = `${info&&info.am?'<b title="오전 출석">☀️</b>':''}${info&&info.pm?'<b title="육퇴 후 출석">🌙</b>':''}`;
    const memo = info && info.memo ? `<div class="daymemo">${esc(info.memo)}</div>` : '';
    logs.push(`<div class="daylog">
      <span>${dt.getMonth()+1}/${dt.getDate()} (${DOW[dt.getDay()]})${info&&info.rest?' · 쉬는 날':''} <span class="att">${att}</span></span>
      <span class="r">${info&&info.sec?fmtDur(info.sec):'—'}${done>0?' · '+done.toFixed(1)+'강':''}${(S.routines||[]).length?' · ☑'+chkCount(ds).done:''}</span>
    </div>${memo}`);
  }

  return `<section>
    <div class="sec-head"><h2>공부 시간</h2><span class="sub">최근 4주</span></div>
    <div class="panel pad">
      <div class="wk">${bars}</div>
      <div class="tiles">
        <div class="tile"><div class="k">누적 공부 시간</div><div class="v">${fmtDur(allSec)}</div></div>
        <div class="tile"><div class="k">전체 진도</div><div class="v">${overall}<small>%</small></div></div>
        <div class="tile"><div class="k">공부한 날</div><div class="v">${studyDays}<small>일</small></div></div>
        <div class="tile"><div class="k">쉰 날</div><div class="v">${restDays}<small>일</small></div></div>
        <div class="tile"><div class="k">출석 체크한 날</div><div class="v">${attDays}<small>일</small></div></div>
      </div>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>캘린더</h2><span class="sub">날짜를 누르면 그날을 기록해요</span></div>
    <div class="panel pad">
      <div class="cal-hd"><div class="t">${y}년 ${m+1}월</div>
        <div class="nav"><button data-mo="-1" aria-label="이전 달">‹</button><button data-mo="1" aria-label="다음 달">›</button></div></div>
      <div class="cal">${DOW.map(w=>`<div class="dow">${w}</div>`).join('')}${cells}</div>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>최근 7일</h2><span class="sub">앉은 시간 · 진도</span></div>
    <div class="panel pad" style="padding-top:2px">${logs.join('')}</div>
  </section>`;
}

/* ---------- 설정 ---------- */
/* 마감일 ↔ 하루 분량 역산 */
function paceCalc(sub, i){
  const remain = Math.max(sub.total - totalAll(sub.id), 0);
  const subjCount = Math.max(S.subjects.length, 1);
  const share = S.phase==='pastexam' ? subjCount : 1;   // 회독 모드는 며칠에 한 번만 배정
  let cur = '';
  if(sub.deadline){
    const left = diffDays(today(), sub.deadline);
    if(left >= 0){
      const slots = Math.max(Math.floor((left+1)/share), 1);
      cur = `지금 마감일이면 <b>이 과목을 하는 날마다 ${(remain/slots).toFixed(1)}${esc(sub.unit)}</b>씩 (남은 ${remain}${esc(sub.unit)} · 배정일 ${slots}일)`;
    } else cur = '마감일이 지났어요.';
  } else cur = '마감일을 정하면 하루 분량이 계산돼요.';

  const per = (ui.perDay && ui.perDay[i]) || '';
  let result = '';
  if(per && +per > 0){
    const days = Math.ceil(remain / +per) * share;
    const eta = ymd(addD(new Date(), days));
    result = `<div class="calc-out">하루 <b>${esc(per)}${esc(sub.unit)}</b>씩이면 <b>${eta}</b>에 끝나요
      <button data-setdl="${i}" data-dl="${eta}">이 날짜를 마감일로</button></div>`;
  }
  return `<div class="calc">
    <div class="calc-now">${cur}</div>
    <div class="calc-in">
      <span>하루</span><input type="text" inputmode="decimal" value="${esc(per)}" data-perday="${i}" placeholder="3" maxlength="5">
      <span>${esc(sub.unit)}씩 하면?</span>
    </div>
    ${result}
  </div>`;
}

        <div class="hint">누적 진도에 그대로 더해져요. 남은 분량도 이 값을 빼고 계산합니다.</div>

        <div class="f"><label>색</label><select data-sf="color" data-si="${i}">
          ${PALETTE.map(c=>`<option value="${c}" ${s.color===c?'selected':''}>${COLOR_NAME[c]}</option>`).join('')}</select></div>
      </div>
    </div>`).join('');

  return `<section>
    <div class="sec-head"><h2>시험일</h2></div>
    <div class="panel pad"><div class="f2">
      <div class="f"><label>국가직</label><input type="date" value="${S.exams.national||''}" data-exam="national"></div>
      <div class="f"><label>지방직</label><input type="date" value="${S.exams.local||''}" data-exam="local"></div>
    </div></div>
  </section>
  <section>

    <div class="panel pad" style="display:flex;flex-direction:column;gap:10px">
      ${subs}<button class="ghost" data-addsubj>+ 과목 추가</button>
    </div>

  <section>

      <div class="f"><label>평일 : 주말 분량 비중</label>
        <div class="f2">
          <input type="number" min="0" value="${S.weekdayWeight}" data-w="weekdayWeight" aria-label="평일 비중">
          <input type="number" min="0" value="${S.weekendWeight}" data-w="weekendWeight" aria-label="주말 비중">
        </div>
        <div class="hint">숫자가 클수록 그 요일에 더 많이 배정돼요. 기본 2:1.</div>
      </div>
      <div class="f"><label>화면 맨 위 제목</label>
        <input type="text" value="${esc(S.meta.title||'')}" data-meta="title" placeholder="설이 인생, 올해로 갈린다" maxlength="40">
        <div class="hint">매일 처음 보는 문장이에요. 언제든 바꿀 수 있어요.</div>
      </div>
      <div class="f2">
        <div class="f"><label>이름</label><input type="text" value="${esc(S.meta.wife)}" data-meta="wife"></div>
        <div class="f"><label>아이 이름</label><input type="text" value="${esc(S.meta.son)}" data-meta="son"></div>
      </div>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>매일 할 것</h2><span class="sub">체크리스트 항목</span></div>
    <div class="panel pad" style="display:flex;flex-direction:column;gap:8px">
      ${(S.routines||[]).map((r,i)=>`<div class="rt-edit">
        <input type="text" class="g" value="${esc(r.g||'')}" data-rf="g" data-ri="${i}" placeholder="과목" maxlength="10">
        <input type="text" value="${esc(r.t)}" data-rf="t" data-ri="${i}" placeholder="할 일" maxlength="60">
        <button data-delroutine="${i}" aria-label="삭제">×</button>
      </div>`).join('')}
      <button class="ghost" data-addroutine>+ 항목 추가</button>
      <div class="hint">앞칸은 묶음 이름(국어·영어처럼), 뒷칸은 할 일이에요. 매일 0시에 자동으로 초기화돼요.</div>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>홈 화면에 추가</h2><span class="sub">앱처럼 쓰기</span></div>
    <div class="panel pad iconrow">
      <img id="iconprev" class="iconprev" src="${ICON||''}" alt="공부 아이콘">
      <div class="hint" style="line-height:1.7">
        아이폰: 아래 <b style="color:var(--dim)">공유</b> 버튼 → <b style="color:var(--dim)">홈 화면에 추가</b><br>
        안드로이드: 브라우저 <b style="color:var(--dim)">⋮</b> 메뉴 → <b style="color:var(--dim)">홈 화면에 추가</b><br>
        이름은 <b style="color:var(--dim)">공부</b>로 나와요.
      </div>

  </section>
  <section>
    <button class="ghost" data-adv style="text-align:left;display:flex;justify-content:space-between">

    </button>
    ${ui.adv?`<div class="panel pad" style="margin-top:9px;display:flex;flex-direction:column;gap:10px">
      <div class="seg2">
        <button data-phase="base" aria-pressed="${S.phase==='base'}"><b>매일 두 과목씩</b>강의 처음 들을 때</button>
        <button data-phase="pastexam" aria-pressed="${S.phase==='pastexam'}"><b>한 과목씩 몰아서</b>기출 돌리고 회독할 때</button>

        <b style="color:var(--dim)">한 과목씩 몰아서</b> — 월·화는 행정법만, 수·목은 교육학만 이렇게 2일씩 번갈아 가요. 이미 본 내용을 회독할 때는 한 과목을 쭉 훑는 게 효율이 좋아요.<br><br>
        완강 전이면 위쪽, 기출 돌리기 시작하면 아래쪽으로 바꿔주세요.
      </div>
    </div>`:''}
  </section>
  <div class="foot">기록은 이 폰에 자동 저장돼요.<br>버전 <b>2026-09-05 · 앱 1.0</b></div>`;

/* ===================== 이벤트 ===================== */
function on(s,e,f){ document.querySelectorAll(s).forEach(el=>el.addEventListener(e,f)); }
function bind(){
  on('[data-tab]','click', e=>{ ui.tab=e.currentTarget.dataset.tab; if(ui.tab==='today'&&!isSelToday()) ui.sel=null; render(); window.scrollTo({top:0}); });
  on('[data-act]','click', e=>{
    const k = e.currentTarget.dataset.act;
    if(k==='start') startDay(); else if(k==='pause') pauseStudy();
    else if(k==='resume') resumeStudy(); else if(k==='end') endDay();
  });
  const memoEl = document.getElementById('memo');
  if(memoEl){
    memoEl.addEventListener('input', ()=>{
      day(sel()).memo = memoEl.value;
      S.updatedAt = Date.now();
      saveLocal();
      const st = document.getElementById('memostate');
      if(st) st.textContent = memoEl.value ? '저장됨' : '';
    });
  }
  on('[data-chk]','click', e=>toggleChk(sel(), e.currentTarget.dataset.chk));
  on('[data-rf]','change', e=>{
    const i=+e.target.dataset.ri, f=e.target.dataset.rf;
    S.routines[i][f] = e.target.value; save(); render();
  });
  on('[data-delroutine]','click', e=>{ S.routines.splice(+e.currentTarget.dataset.delroutine,1); save(); render(); });
  on('[data-addroutine]','click', ()=>{
    S.routines.push({ id:'r'+Date.now(), g:'', t:'' }); save(); render();
  });
  on('[data-att]','click', e=>toggleAtt(sel(), e.currentTarget.dataset.att));
  on('[data-undo]','click', undoLast);
  on('[data-undoclose]','click', ()=>{ ui.undo=null; render(); });
  on('[data-edittime]','click', ()=>{ ui.editTime=!ui.editTime; render(); });
  on('[data-canceltime]','click', ()=>{ ui.editTime=false; render(); });
  on('[data-savetime]','click', e=>{
    const h=+(document.querySelector('[data-eh]').value||0), m=+(document.querySelector('[data-em]').value||0);
    setDaySec(e.currentTarget.dataset.savetime, h, m);
  });

  on('[data-rest]','click', ()=>{ const d=day(sel()); d.rest=!d.rest; ui.quote=null; save(); render(); });
  on('[data-cond]','click', e=>{ day(sel()).cond = +e.currentTarget.dataset.cond; ui.quote=null; save(); render(); });
  on('[data-done]','change', e=>{ day(sel()).done[e.target.dataset.done] = Math.max(0, +e.target.value||0); ui.quote=null; save(); render(); });
  on('[data-step]','click', e=>{
    const b=e.currentTarget, d=day(sel()), sid=b.dataset.sid;
    d.done[sid] = Math.max(0, Math.round(((d.done[sid]||0)+(+b.dataset.step))*10)/10);
    ui.quote=null; save(); render();
  });
  on('[data-newquote]','click', ()=>{ ui.quote=pickQuote(); render(); });

  on('[data-pick]','click', e=>{ ui.sel=e.currentTarget.dataset.pick; ui.tab='today'; ui.quote=null; ui.editTime=false; render(); window.scrollTo({top:0}); });
  on('[data-mo]','click', e=>{
    ui.calM += +e.currentTarget.dataset.mo;
    if(ui.calM<0){ ui.calM=11; ui.calY--; } if(ui.calM>11){ ui.calM=0; ui.calY++; }
    render();
  });

  on('[data-note-add]','click', ()=> addNote(document.querySelector('[data-note-subj]').value, document.querySelector('[data-note-text]').value));
  const nt=document.querySelector('[data-note-text]');
  if(nt) nt.addEventListener('keydown', e=>{ if(e.key==='Enter') addNote(document.querySelector('[data-note-subj]').value, e.target.value); });
  on('[data-review]','click', e=>reviewNote(e.currentTarget.dataset.review));
  on('[data-close]','click', e=>closeNote(e.currentTarget.dataset.close));
  on('[data-delnote]','click', e=>delNote(e.currentTarget.dataset.delnote));
  on('[data-ntab]','click', e=>{ ui.noteTab=e.currentTarget.dataset.ntab; render(); });

  on('[data-exam]','change', e=>{ S.exams[e.target.dataset.exam]=e.target.value; save(); render(); });
  on('[data-adv]','click', ()=>{ ui.adv=!ui.adv; render(); });
  on('[data-phase]','click', e=>{ S.phase=e.currentTarget.dataset.phase; save(); render(); });
  on('[data-sf]','change', e=>{
    const i=+e.target.dataset.si, f=e.target.dataset.sf;
    S.subjects[i][f] = (f==='total'||f==='pre') ? (+e.target.value||0) : e.target.value;
    save(); render();
  });
  on('[data-perday]','input', e=>{
    const key = e.target.dataset.perday;
    ui.perDay[+key] = e.target.value.replace(/[^0-9.]/g,'');
    render();
    try{
      const el = document.querySelector('[data-perday="'+key+'"]');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }catch(err){}
  });
  on('[data-setdl]','click', e=>{
    const i=+e.currentTarget.dataset.setdl;
    S.subjects[i].deadline = e.currentTarget.dataset.dl;
    ui.perDay[i]=''; save(); render();
  });
  on('[data-delsubj]','click', e=>{ S.subjects.splice(+e.currentTarget.dataset.delsubj,1); save(); render(); });
  on('[data-addsubj]','click', ()=>{
    S.subjects.push({ id:'s'+Date.now(), name:'새 과목', unit:'강', total:0, deadline:'', color:PALETTE[S.subjects.length%PALETTE.length] });
    save(); render();
  });
  on('[data-w]','change', e=>{ S[e.target.dataset.w]=Math.max(0,+e.target.value||0); save(); render(); });
  on('[data-meta]','change', e=>{ S.meta[e.target.dataset.meta]=e.target.value; save(); render(); });
}

/* ===================== 홈 화면 아이콘 =====================
   '공부' 두 글자를 캔버스에 그려서 아이콘으로 심는다.
   홈 화면에 추가하면 이름도 '공부'로 나온다. */
let ICON = null;
function drawIcon(size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#FFFDF3'); g.addColorStop(1,'#FCEFC9');
  x.fillStyle = g; x.fillRect(0,0,size,size);
  const lw = size*0.045;
  x.strokeStyle = '#EFD489'; x.lineWidth = lw;
  x.strokeRect(lw/2, lw/2, size-lw, size-lw);
  x.fillStyle = '#D18F06';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `${Math.round(size*0.44)}px Jua, 'Noto Sans KR', sans-serif`;
  x.fillText('공부', size/2, size*0.55);
  return c.toDataURL('image/png');
}
async function installIcon(){
  try{
    if(document.fonts){ await document.fonts.load("64px Jua"); await document.fonts.ready; }
  }catch(e){}
  const i180 = drawIcon(180), i192 = drawIcon(192), i512 = drawIcon(512);
  ICON = i180;
  const head = document.head || document.documentElement;
  const add = (tag, attrs)=>{ const el = document.createElement(tag); for(const k in attrs) el.setAttribute(k, attrs[k]); head.appendChild(el); };
  add('link',{ rel:'apple-touch-icon', sizes:'180x180', href:i180 });
  add('link',{ rel:'icon', type:'image/png', href:i192 });
  add('meta',{ name:'apple-mobile-web-app-title', content:'공부' });
  add('meta',{ name:'apple-mobile-web-app-capable', content:'yes' });
  add('meta',{ name:'application-name', content:'공부' });
  add('meta',{ name:'theme-color', content:'#FAF4E8' });
  try{
    const mf = { name:'공부', short_name:'공부', display:'standalone',
      background_color:'#FAF4E8', theme_color:'#FAF4E8', start_url:location.href,
      icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}] };
    add('link',{ rel:'manifest', href:'data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(mf)) });
  }catch(e){}
  document.title = '공부';
  const prev = document.getElementById('iconprev'); if(prev) prev.src = i180;
}


document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ try{ saveLocal(); }catch(e){} }
  else if(running()) render();
});
window.addEventListener('pagehide', ()=>{ try{ saveLocal(); }catch(e){} });
boot();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
